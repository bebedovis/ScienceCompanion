[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "science-compadre"
version = "0.1.0"
description = "Production RAG system for scientific research"
requires-python = ">=3.11"
dependencies = [
    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # LangGraph / LangChain
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.2.0",
    # Vector store
    "chromadb>=0.5.0",
    # Embeddings & ML
    "sentence-transformers>=3.0.0",
    "torch>=2.3.0",
    # PDF parsing
    "PyMuPDF>=1.24.0",
    # LLM providers
    "openai>=1.35.0",
    "httpx>=0.27.0",
    # Retrieval
    "rank-bm25>=0.2.2",
    "tiktoken>=0.7.0",
    # Utilities
    "numpy>=1.26.0",
    "python-dateutil>=2.9.0",
]


[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
